name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq shellcheck
          python3 -m pip install --quiet jsonschema pytest

      - name: Lint hooks
        run: bash tests/lint-hooks.sh

      - name: Validate JSON schemas
        run: bash tests/validate-schemas.sh

      - name: Validate roster config
        run: bash tests/validate-config.sh

      - name: Deterministic state-machine tests
        run: bash tests/run-state-tests.sh

      - name: Hook integration tests
        run: bash tests/run-hook-tests.sh

      - name: Validate plugin + marketplace manifests
        run: |
          python3 -c "import json;json.load(open('.claude-plugin/plugin.json'))"
          python3 -c "import json;json.load(open('.claude-plugin/marketplace.json'))"
          python3 -c "import json;json.load(open('.jje/config.example.json'))"

      - name: Sample-target fixture is red before any fix
        run: |
          cd examples/sample-target
          if make ci; then echo "fixture should fail until fixed" && exit 1; else echo "fixture correctly red"; fi
