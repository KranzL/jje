version: 2

models:
  - name: fct_invoice_lines
    description: >
      Invoice line fact at line grain, enriched with a daily FX rate and a
      reporting-currency conversion. Consumed by fct_revenue_daily and by the
      Finance BI revenue dashboards.
    config:
      contract:
        enforced: true
    columns:
      - name: invoice_line_id
        data_type: bigint
        constraints:
          - type: not_null
          - type: primary_key
      - name: invoice_id
        data_type: bigint
        constraints:
          - type: not_null
      - name: product_id
        data_type: bigint
        constraints:
          - type: not_null
      - name: quantity
        data_type: integer
        constraints:
          - type: not_null
      - name: unit_amount
        description: Per-unit price in transaction currency.
        data_type: numeric(18,2)
        constraints:
          - type: not_null
      - name: discount_amount
        description: Line-level discount in transaction currency.
        data_type: numeric(18,4)
      - name: transaction_currency_code
        data_type: varchar(3)
        constraints:
          - type: not_null
      - name: fx_rate
        description: Transaction-currency to USD rate on the invoice date.
        data_type: numeric(18,8)
        constraints:
          - type: not_null
      - name: reporting_currency_code
        data_type: varchar(3)
        constraints:
          - type: not_null
      - name: gross_amount
        description: (unit_amount * quantity) - discount, transaction currency.
        data_type: numeric(18,2)
        constraints:
          - type: not_null
      - name: gross_amount_usd
        description: Gross amount converted to USD reporting currency.
        data_type: numeric(18,4)
        constraints:
          - type: not_null
      - name: invoiced_at
        data_type: timestamp
        constraints:
          - type: not_null

  - name: fct_revenue_daily
    description: >
      Daily revenue rollup by reporting currency. One row per (revenue_date,
      reporting_currency_code). Surfaced to the executive revenue report.
    config:
      contract:
        enforced: true
    columns:
      - name: revenue_date
        data_type: date
        constraints:
          - type: not_null
      - name: reporting_currency_code
        data_type: varchar(3)
        constraints:
          - type: not_null
      - name: invoice_count
        data_type: bigint
        constraints:
          - type: not_null
      - name: units_sold
        data_type: bigint
        constraints:
          - type: not_null
      - name: gross_amount_txn
        data_type: numeric(18,2)
        constraints:
          - type: not_null
      - name: gross_amount_usd
        data_type: numeric(18,4)
        constraints:
          - type: not_null
