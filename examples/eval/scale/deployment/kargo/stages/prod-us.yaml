apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod-us
  namespace: payments
  annotations:
    kargo.akuity.io/color: red
spec:
  requestedFreight:
  - origin:
      kind: Warehouse
      name: payments-svc
    sources:
      stages:
      - staging
  promotionTemplate:
    spec:
      vars:
      - name: targetPath
        value: ./env/prod-us
      steps:
      - uses: git-clone
        config:
          repoURL: https://github.com/acme/payments-manifests.git
          checkout:
          - branch: main
            path: ./src
          - branch: stage/prod-us
            create: true
            path: ./out
      - uses: yaml-update
        config:
          path: ./src/${{ vars.targetPath }}/values.yaml
          updates:
          - key: image.tag
            value: ${{ imageFrom("ghcr.io/acme/payments-svc").Tag }}
      - uses: kustomize-build
        config:
          path: ./src/${{ vars.targetPath }}
          outPath: ./out/manifests.yaml
      - uses: git-commit
        config:
          path: ./out
          message: "prod-us: promote payments-svc ${{ imageFrom("ghcr.io/acme/payments-svc").Tag }}"
      - uses: git-push
        config:
          path: ./out
      - uses: argocd-update
        config:
          apps:
          - name: payments-prod-us
            sources:
            - repoURL: https://github.com/acme/payments-manifests.git
              desiredRevision: ${{ outputs["git-commit"].commit }}
