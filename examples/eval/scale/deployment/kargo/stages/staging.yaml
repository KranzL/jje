apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: staging
  namespace: payments
  annotations:
    kargo.akuity.io/color: green
spec:
  requestedFreight:
  - origin:
      kind: Warehouse
      name: payments-svc
    sources:
      stages:
      - dev
  promotionTemplate:
    spec:
      vars:
      - name: targetPath
        value: ./env/staging
      steps:
      - uses: git-clone
        config:
          repoURL: https://github.com/acme/payments-manifests.git
          checkout:
          - branch: main
            path: ./src
          - branch: stage/staging
            create: true
            path: ./out
      - uses: yaml-update
        config:
          path: ./src/${{ vars.targetPath }}/values.yaml
          updates:
          - key: image.tag
            value: ${{ imageFrom("ghcr.io/acme/payments-svc").Tag }}
      - uses: kustomize-build
        config:
          path: ./src/${{ vars.targetPath }}
          outPath: ./out/manifests.yaml
      - uses: git-commit
        config:
          path: ./out
          message: "staging: promote payments-svc ${{ imageFrom("ghcr.io/acme/payments-svc").Tag }}"
      - uses: git-push
        config:
          path: ./out
      - uses: argocd-update
        config:
          apps:
          - name: payments-staging
            sources:
            - repoURL: https://github.com/acme/payments-manifests.git
              desiredRevision: ${{ outputs["git-commit"].commit }}
  verification:
    analysisTemplates:
    - name: canary-success-rate
    args:
    - name: service
      value: payments-svc
    - name: namespace
      value: payments-staging
    - name: prometheus-url
      value: https://prometheus.staging.acme.internal
