apiVersion: kargo.akuity.io/v1alpha1
kind: Project
metadata:
  name: payments
  labels:
    team: payments-platform
    tier: critical
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: payments-svc
  namespace: payments
spec:
  freightCreationPolicy: Automatic
  interval: 5m0s
  subscriptions:
  - image:
      repoURL: ghcr.io/acme/payments-svc
      imageSelectionStrategy: SemVer
      semverConstraint: ">=2.4.0 <3.0.0"
      strictSemvers: true
      discoveryLimit: 20
  - git:
      repoURL: https://github.com/acme/payments-manifests.git
      branch: main
      commitSelectionStrategy: NewestFromBranch
