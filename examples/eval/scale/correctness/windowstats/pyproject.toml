[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "windowstats"
version = "0.4.0"
description = "Sliding time-window event aggregation"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["windowstats*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
