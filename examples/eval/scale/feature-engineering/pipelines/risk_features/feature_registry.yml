version: 3
model: application_default_risk
anchor: decision_at
performance_window_days: 90

feature_groups:
  transactions:
    version: 2
    entity_key: borrower_id
    event_time: snapshot_at
    features:
      - txn_count_30d
      - txn_amount_30d
      - txn_count_7d
      - nsf_count_90d

  credit_bureau:
    version: 4
    entity_key: borrower_id
    event_time: pulled_at
    staleness_tolerance_days: 35
    features:
      - fico_score
      - revolving_utilization
      - inquiries_6m
      - open_tradelines

  account_balance:
    version: 1
    entity_key: borrower_id
    event_time: balance_at
    features:
      - deposit_balance
      - min_balance_30d
      - avg_balance_30d
      - days_negative_30d
