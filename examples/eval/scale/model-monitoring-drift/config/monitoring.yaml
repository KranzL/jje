model: fraud_propensity_v4
score_column: score

numeric_features:
  - amount
  - account_age_days
  - txn_velocity_1h
  - distance_from_home_km

categorical_features:
  - merchant_category
  - device_type
  - channel

thresholds:
  psi: 0.2
  categorical_js: 0.1
  score_psi: 0.2
  positive_rate_tolerance: 0.05

decision_threshold: 0.5

windows:
  comparison_days: 14
  label_lag_days: 7

schedule:
  cron: "0 6 * * *"
