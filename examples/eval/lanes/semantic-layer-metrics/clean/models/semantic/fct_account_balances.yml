semantic_models:
  - name: account_balances
    description: Daily end-of-day account balance snapshot, one row per account per day.
    model: ref('fct_account_balances')
    defaults:
      agg_time_dimension: balance_date
    entities:
      - name: account
        type: primary
        expr: account_id
    dimensions:
      - name: balance_date
        type: time
        type_params:
          time_granularity: day
      - name: region
        type: categorical
    measures:
      - name: account_balance
        description: End-of-day account balance, semi-additive over time.
        agg: sum
        expr: balance_amount
        non_additive_dimension:
          name: balance_date
          window_choice: max

metrics:
  - name: total_account_balance
    description: Total account balance at the latest day in the queried period.
    type: simple
    type_params:
      measure: account_balance
